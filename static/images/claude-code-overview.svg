    <text class="detail" x="62" y="616">Run checks at lifecycle events</text>
    <text class="example" x="62" y="648">PreToolUse · PostToolUse · Stop</text>
    <circle class="port" cx="360" cy="610" r="3"/>
  </g>
  <g>
    <rect class="node" x="440" y="578" width="320" height="128" rx="8"/>
    <text class="label" x="462" y="617">Permissions</text>
    <text class="detail" x="462" y="648">Control which actions can run</text>
    <text class="example" x="462" y="680">Allow · ask · deny / settings.json</text>
    <circle class="port" cx="600" cy="578" r="3"/>
  </g>
  <g>
    <rect class="node" x="840" y="546" width="320" height="128" rx="8"/>
    <text class="label" x="862" y="585">Subagents</text>
    <text class="detail" x="862" y="616">Delegate focused tasks</text>
    <text class="example" x="862" y="648">Separate context · parallel work</text>
    <circle class="port" cx="840" cy="610" r="3"/>
  </g>

  <path d="M40 746 H1160" stroke="#d1ccc0" stroke-width="1"/>
  <text x="40" y="781" font-size="19" font-weight="600">Our path through the workshop</text>
  <text x="40" y="817" font-size="19" fill="#635f55">Setup → Foundations → Skills &amp; MCP → GSD / BMAD / Matt Pocock’s skills</text>
  <text x="40" y="849" font-size="19" fill="#635f55">→ Security &amp; hardening → Existing codebases</text>
</svg>
