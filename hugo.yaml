baseURL: "https://claude-docs.devbionics.com/"
title: "Agentic Coding in Terminal"

enableRobotsTXT: true
enableGitInfo: true
enableInlineShortcodes: true

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

# llms.txt convention (https://llmstxt.org) — curated index + full-content
# dump rendered from the home page so LLM consumers can ingest the docs
# without scraping HTML.
outputFormats:
  LlmsTxt:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  LlmsFullTxt:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, LlmsTxt, LlmsFullTxt]

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/stcomiin/claude-docs"
      params:
        icon: github

params:
  # Site description. Read by Hextra's opengraph and page-description
  # partials via .Site.Params.description (top-level `description` is not
  # mirrored into Site.Params, so it must live here to be picked up).
  description: "Workshop materials — Apex Builders Collective × Info PC"

  # Used by Hextra's opengraph partial and Hugo's internal twitter_cards
  # partial to populate og:image / twitter:image for link previews
  # (Telegram, WhatsApp, Slack, X, Facebook, etc.).
  images:
    - images/og-cover.png

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  theme:
    default: dark
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/stcomiin/claude-docs/edit/main/content"

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: wide
